# Apache snippet — variant B: subpath on the existing site (https://barismutlu.de/fire/), no new DNS record
# and no new certificate. Paste INSIDE the existing <VirtualHost *:443> block for barismutlu.de, then:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   uncomment STREAMLIT_SERVER_BASE_URL_PATH=fire in /etc/systemd/system/firecal.service
#   sudo systemctl daemon-reload && sudo systemctl restart firecal
#   sudo apache2ctl configtest && sudo systemctl reload apache2

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/fire/(.*)$ ws://127.0.0.1:8501/fire/$1 [P,L]

    RedirectMatch ^/fire$ /fire/
    ProxyPass        /fire/ http://127.0.0.1:8501/fire/
    ProxyPassReverse /fire/ http://127.0.0.1:8501/fire/
    ProxyTimeout 3600
