# Apache vhost — variant A: own subdomain (recommended). Replace fire.barismutlu.de if you pick another name.
# Needs a DNS A record  fire.barismutlu.de → 159.195.126.141  BEFORE running certbot.
#
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#   sudo cp deploy/vps/apache-subdomain.conf /etc/apache2/sites-available/firecal.conf
#   sudo a2ensite firecal && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d fire.barismutlu.de        # adds the :443 vhost + HTTP→HTTPS redirect
#
# Streamlit talks to the browser over a WebSocket (/_stcore/stream); without the Upgrade rule the page
# loads but stays on "Please wait…".
<VirtualHost *:80>
    ServerName fire.barismutlu.de

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8501/$1 [P,L]

    ProxyPass        / http://127.0.0.1:8501/
    ProxyPassReverse / http://127.0.0.1:8501/

    # long-lived WebSocket: do not cut idle sessions after the default 60 s
    ProxyTimeout 3600

    ErrorLog  ${APACHE_LOG_DIR}/firecal_error.log
    CustomLog ${APACHE_LOG_DIR}/firecal_access.log combined
</VirtualHost>
