[theme]
base = "dark"
# koyu tema: uydu altlığı + viridis (takvim ve ısı haritası) ile uyumlu; vurgu = viridis açık yeşil
primaryColor = "#b5de2b"
backgroundColor = "#0e1014"
secondaryBackgroundColor = "#171a21"
textColor = "#e8e6f0"
borderColor = "#2b2f3a"
showSidebarBorder = true
font = "sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
metricValueFontWeight = 650
paddingTop = "2.5rem"

[client]
# sağ üstteki geliştirici menüsünü (Deploy, ⋮) gizle — jüri/kullanıcı için sade görünüm
toolbarMode = "viewer"
