[theme]
base = "dark"
# sıcak koyu gri zemin + yanık turuncu vurgu (uydu altlığı ve alev paletiyle uyumlu)
primaryColor = "#d9742b"
backgroundColor = "#1d1c1a"
secondaryBackgroundColor = "#272522"
textColor = "#ece7de"
borderColor = "#3b3834"
showSidebarBorder = true
font = "sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
metricValueFontWeight = 650
paddingTop = "2.5rem"

[client]
# sağ üstteki geliştirici menüsünü (Deploy, ⋮) gizle — jüri/kullanıcı için sade görünüm
toolbarMode = "viewer"
