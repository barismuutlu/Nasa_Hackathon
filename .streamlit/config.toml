[theme]
base = "dark"
# warm dark grey background + burnt orange accent (matches the satellite basemap and flame palette)
primaryColor = "#d9742b"
backgroundColor = "#1d1c1a"
secondaryBackgroundColor = "#272522"
textColor = "#ece7de"
borderColor = "#3b3834"
showSidebarBorder = true
font = "sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
metricValueFontWeight = 650
paddingTop = "2.5rem"

[client]
# hide the developer menu at the top right (Deploy, ⋮) — clean look for the jury/users
toolbarMode = "viewer"
